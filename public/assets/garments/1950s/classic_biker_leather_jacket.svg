<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- 1950s Classic Biker Leather Jacket -->
  <g id="classic-biker-jacket" fill="#222222" stroke="#111111" stroke-width="2" stroke-linejoin="round">
    <!-- Main Jacket Body -->
    <path d="M 210 205 
             L 240 215 
             L 260 215 
             L 290 205 
             L 305 270 
             L 285 275 
             L 280 330 
             L 220 330 
             L 215 275 
             L 195 270 
             Z" />
             
    <!-- Asymmetrical Zipper Lapel Left -->
    <path d="M 235 215 L 265 265 L 230 260 Z" fill="#333333" stroke="#silver" stroke-width="1" />
    
    <!-- Lapel Right -->
    <path d="M 265 215 L 270 250 L 255 240 Z" fill="#2b2b2b" stroke="#silver" stroke-width="1" />
    
    <!-- Asymmetric Main Zipper -->
    <path d="M 260 240 L 245 330" stroke="#A0A0A0" stroke-width="2" stroke-dasharray="3,1" fill="none" />
    
    <!-- Waist Belt with Buckle -->
    <rect x="220" y="320" width="60" height="10" fill="#1a1a1a" stroke="#silver" stroke-width="1" />
    <rect x="245" y="318" width="10" height="14" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    
    <!-- Pocket Zippers -->
    <line x1="225" y1="285" x2="240" y2="295" stroke="#A0A0A0" stroke-width="1.5" />
    <line x1="262" y1="290" x2="275" y2="290" stroke="#A0A0A0" stroke-width="1.5" />
  </g>
</svg>